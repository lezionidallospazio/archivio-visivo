const scene=new THREE.Scene(); scene.background=new THREE.Color(0x101116);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,10000); camera.position.set(0,0,115);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); document.body.appendChild(renderer.domElement);
const controls=new THREE.OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.dampingFactor=.06;
const raycaster=new THREE.Raycaster(); raycaster.params.Sprite={threshold:.7}; const mouse=new THREE.Vector2(); const tip=document.getElementById('tip');
const categories=[...new Set(DATA.map(p=>p.category).filter(Boolean))].sort();
const select=document.getElementById('category'); categories.forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;select.appendChild(o)});
const maxCoord=Math.max(...DATA.flatMap(p=>[Math.abs(p.x),Math.abs(p.y),Math.abs(p.z)]),1); const scale=48/maxCoord;
const sprites=[];
DATA.forEach((p,i)=>{const tex=new THREE.TextureLoader().load(p.img);tex.minFilter=THREE.LinearFilter;
 const mat=new THREE.SpriteMaterial({map:tex,transparent:true,opacity:1});const s=new THREE.Sprite(mat);
 s.position.set(p.x*scale,p.y*scale,p.z*scale);s.scale.set(4.1,4.1,1);s.userData={p,i};scene.add(s);sprites.push(s);});
function matches(p){const q=document.getElementById('search').value.toLowerCase();const c=select.value;
 const hay=[p.id,p.filename,p.subject,p.category,p.source,p.author,p.notes].join(' ').toLowerCase();
 return (!q||hay.includes(q))&&(!c||p.category===c);}
function refresh(){let n=0;sprites.forEach(s=>{const ok=matches(s.userData.p);s.visible=ok;if(ok)n++;});document.getElementById('count').textContent=n+' / '+DATA.length+' immagini visibili';}
document.getElementById('search').addEventListener('input',refresh);select.addEventListener('change',refresh);refresh();
window.addEventListener('mousemove',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(mouse,camera);
 const hits=raycaster.intersectObjects(sprites.filter(s=>s.visible));if(!hits.length){tip.style.display='none';return;}
 const p=hits[0].object.userData.p;tip.style.display='block';tip.style.left=Math.min(e.clientX+16,innerWidth-290)+'px';tip.style.top=Math.min(e.clientY+16,innerHeight-300)+'px';
 tip.innerHTML='';const title=document.createElement('strong');title.textContent=p.subject||p.filename;tip.appendChild(title);
 if(p.img){const im=document.createElement('img');im.src=p.img;tip.appendChild(im);}
 const meta=document.createElement('div');meta.className='meta';
 meta.textContent=[p.category&&'Categoria: '+p.category,p.author&&'Autore: '+p.author,p.source&&'Fonte: '+p.source,p.notes].filter(Boolean).join('\n');tip.appendChild(meta);
});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}animate();
